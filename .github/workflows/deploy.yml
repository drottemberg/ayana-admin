name: Deploy to production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayana-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: https://api.ayana.club/api
      VITE_SOCKET_URL: https://api.ayana.club

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          key = os.environ.get("SSH_PRIVATE_KEY", "").strip()
          if not key:
              raise SystemExit("SSH_PRIVATE_KEY is empty. Add the server's private deploy key as a repository secret.")

          key = key.replace("\\r\\n", "\\n").replace("\\n", "\n").replace("\r\n", "\n")
          if "-----BEGIN " not in key:
              try:
                  decoded = base64.b64decode(key, validate=True).decode("utf-8")
                  if "-----BEGIN " in decoded:
                      key = decoded
              except (ValueError, UnicodeDecodeError):
                  pass

          if "-----BEGIN " not in key or "PRIVATE KEY-----" not in key:
              raise SystemExit("SSH_PRIVATE_KEY must be a private PEM/OpenSSH key, raw or Base64 encoded.")

          path = Path.home() / ".ssh" / "deploy_key"
          path.write_text(key.rstrip() + "\n")
          path.chmod(0o600)
          PY
          ssh-keygen -y -P "" -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H 104.156.53.38 >> ~/.ssh/known_hosts

      - name: Create remote directory
        run: ssh -i ~/.ssh/deploy_key root@104.156.53.38 "mkdir -p /data/project/ayana-admin"

      - name: Deploy static application
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            root@104.156.53.38:/data/project/ayana-admin/
